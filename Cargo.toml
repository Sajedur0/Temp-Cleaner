[package]
name = "temp_cleaner"
version = "1.0.0"
edition = "2021"
description = "A fast, safe temp-file cleaner for Windows — GUI toast for double-click use, scriptable CLI for automation"
license = "Apache-2.0"
repository = "https://github.com/Sajedur0/Temp-Cleaner"
homepage = "https://github.com/Sajedur0/Temp-Cleaner"
keywords = ["windows", "cleanup", "temp", "utility"]
categories = ["command-line-utilities"]

[[bin]]
name = "TempCleaner"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = [
    "fileapi",
    "handleapi",
    "libloaderapi",
    "minwindef",
    "ntdef",
    "processenv",
    "processthreadsapi",
    "securitybaseapi",
    "shellapi",
    "winbase",
    "wincon",
    "windef",
    "wingdi",
    "winnt",
    "winuser",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
